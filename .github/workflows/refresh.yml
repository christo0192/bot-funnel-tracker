name: Refresh IK Bot Console

# Cloud-scheduled daily refresh — no local machine needed.
# 04:37 UTC ≈ 10:07 IST. An odd, off-peak minute on purpose: GitHub's `schedule`
# trigger is best-effort and is most often delayed/dropped at :00 and :30, so we
# avoid the busy top/half of the hour. Also runnable on demand from the Actions tab.
# NOTE: needs GitHub Actions to be runnable (public repo = free minutes). If a run
# fails instantly ("job was not started because recent account payments have failed"),
# that's account billing, not this file.
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet google-cloud-bigquery

      - name: Write service-account key
        run: printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Build data from BigQuery
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: python pipeline/build_data.py --out data.json

      - name: Inject data into the dashboard
        run: python pipeline/inject.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm i -g vercel@58

      - name: Deploy to Vercel (production)
        working-directory: site
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          # Pre-link the project (projectId + orgId) so deploy is non-interactive and
          # never prompts. .vercelignore keeps .vercel out of the uploaded bundle.
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          url=$(timeout 180 vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "$url" > "$RUNNER_TEMP/url.txt"

      - name: Summary
        run: echo "Deployed https://bot-funnel-tracker.vercel.app at $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
