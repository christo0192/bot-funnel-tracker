name: Refresh IK Bot Console

# Daily refresh — build from BigQuery, inject, deploy to Vercel.
#
# PRIMARY trigger: an external cron service (cron-job.org) calls this workflow via
# the GitHub API (workflow_dispatch) at exactly 10:00 IST — GitHub's own `schedule`
# is best-effort and never punctual, so the precise 10 a.m. run comes from outside.
#
# FALLBACK: the `schedule` below runs at 07:30 UTC (13:00 IST) as a safety net in
# case the external service ever fails to fire — deliberately hours after 10:00 so
# it does NOT collide with (double up) the punctual external trigger. Deploys are
# idempotent, so a duplicate run is harmless.
on:
  schedule:
    - cron: "30 7 * * *"   # 13:00 IST fallback only — punctual 10:00 run comes from cron-job.org
  workflow_dispatch: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet google-cloud-bigquery

      - name: Write service-account key
        run: printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Build data from BigQuery
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: python pipeline/build_data.py --out data.json

      - name: Inject data into the dashboard
        run: python pipeline/inject.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm i -g vercel@58

      - name: Deploy to Vercel (production)
        working-directory: site
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          # Pre-link the project (projectId + orgId) so deploy is non-interactive and
          # never prompts. .vercelignore keeps .vercel out of the uploaded bundle.
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          url=$(timeout 180 vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "$url" > "$RUNNER_TEMP/url.txt"

      - name: Summary
        run: echo "Deployed https://bot-funnel-tracker.vercel.app at $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
